

<script>
  class myAnimal {
    constructor(passName, passAge) {
      this.myName = passName;
      this.myAge = passAge;
    }

    myShow() {
      document.getElementById('myDiv01').innerHTML =
        'Hello ' + this.myName + '<br>';
    }
  }

  class myCat extends myAnimal {
    myShow() {
      document.getElementById('myDiv01').innerHTML =
        this.myName + ' is a great cat!';
    }
  }

  function showAnimal() {
    let myDog = new myAnimal('Snickers', 5);
    myDog.myShow();
  }

  function showCat() {
    let myPet = new myCat('Fluffy', 14);
    myPet.myShow();
  }
</script>

<h2>t1a14-extend-class-by-Ektaj.html</h2>
Extending a pre-existing Class<br><br>

<h4>Example Animal Class</h4>
<button onclick="showAnimal()">Show Animal</button>

<h4>Example Extending Animal Class</h4>
<button onclick="showCat()">Show Cat</button>

<div id="myDiv01">Output goes here</div>
