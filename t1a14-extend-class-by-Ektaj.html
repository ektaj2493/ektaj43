<!DOCTYPE html>
<html>
<head>
  <title>Extend Animal Class</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background-color: white;
    }

    h2 {
      color: black;
    }

    button {
      padding: 10px;
      margin: 5px;
      background-color: #444;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #222;
    }

    #myDiv01 {
      margin: 20px;
      padding: 15px;
      font-size: 20px;
      color: black;
    }
  </style>
</head>

<body>

  <h2>t1a14-extend-class-by-Ektaj.html</h2>
  <p>Extending a pre-existing Class</p>

  <h3>Example Animal Class</h3>
  <button onclick="showAnimal()">Show Animal</button>

  <h3>Example Extending Animal Class</h3>
  <button onclick="showCat()">Show Cat</button>

  <div id="myDiv01">Your output will appear here!</div>

  <script>
    class myAnimal {
      constructor(passName, passAge) {
        this.myName = passName;
        this.myAge = passAge;
      }

      myShow() {
        document.getElementById('myDiv01').innerHTML =
          'Hello, my name is ' + this.myName +
          ' and I am ' + this.myAge + ' years old!';
      }
    }

    class myCat extends myAnimal {
      myShow() {
        document.getElementById('myDiv01').innerHTML =
          this.myName + ' is a great cat! Age: ' +
          this.myAge;
      }
    }

    function showAnimal() {
      let myDog = new myAnimal('Snickers', 5);
      myDog.myShow();
    }

    function showCat() {
      let myPet = new myCat('Fluffy', 14);
      myPet.myShow();
    }
  </script>

</body>
</html>
