<h4>Example Input Output Code</h4>

<pre>
let myIn01 = document.getElementById('myNum01').value;
document.getElementById('myDiv01').innerHTML = 'Hi';
</pre>

<h4>Enter Your Numbers</h4>

<input id="myNum01" type="number" value="4">
<input id="myNum02" type="number" value="2">

<br><br>

<input type="button" value="Square" onclick="
    let n = Number(document.getElementById('myNum01').value);
    document.getElementById('myDiv01').innerHTML =
    n + ' squared = ' + (n * n);
">

<input type="button" value="Add" onclick="
    let a = Number(document.getElementById('myNum01').value);
    let b = Number(document.getElementById('myNum02').value);
    document.getElementById('myDiv01').innerHTML =
    a + ' + ' + b + ' = ' + (a + b);
">

<input type="button" value="Subtract" onclick="
    let a = Number(document.getElementById('myNum01').value);
    let b = Number(document.getElementById('myNum02').value);
    document.getElementById('myDiv01').innerHTML =
    a + ' - ' + b + ' = ' + (a - b);
">

<input type="button" value="Multiply" onclick="
    let a = Number(document.getElementById('myNum01').value);
    let b = Number(document.getElementById('myNum02').value);
    document.getElementById('myDiv01').innerHTML =
    a + ' x ' + b + ' = ' + (a * b);
">

<input type="button" value="Divide" onclick="
    let a = Number(document.getElementById('myNum01').value);
    let b = Number(document.getElementById('myNum02').value);
    document.getElementById('myDiv01').innerHTML =
    b === 0 ? 'Cannot divide by zero' : a + ' / ' + b + ' = ' + (a / b);
">

<input type="button" value="Cube" onclick="
    let n = Number(document.getElementById('myNum01').value);
    document.getElementById('myDiv01').innerHTML =
    n + ' cubed = ' + (n * n * n);
">

<input type="button" value="Average" onclick="
    let a = Number(document.getElementById('myNum01').value);
    let b = Number(document.getElementById('myNum02').value);
    document.getElementById('myDiv01').innerHTML =
    'Average = ' + ((a + b) / 2);
">

<input type="button" value="Bigger Number" onclick="
    let a = Number(document.getElementById('myNum01').value);
    let b = Number(document.getElementById('myNum02').value);
    document.getElementById('myDiv01').innerHTML =
    a > b ? a + ' is bigger' : b > a ? b + ' is bigger' : 'Numbers are equal';
">

<br><br>

<div id="myDiv01" style="background-color: lightblue; padding: 15px;">
    Your answer will appear here.
</div>
