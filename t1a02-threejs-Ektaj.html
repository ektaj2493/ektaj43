<!-- Load libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

<style>
  body {
    font-family: Arial;
    text-align: center;
    background: lightblue;
  }

  button {
    padding: 10px;
    margin: 5px;
    cursor: pointer;
  }
</style>

<h3>Plotly Examples</h3>
<button onclick="showPlot()">Show Line Graph</button>
<button onclick="showBar()">Show Bar Chart</button>

<h3>Three.js Examples</h3>
<button onclick="showCube()">Show 3D Cube</button>

<div id="myPlot" style="width:100%;height:300px"></div>
<div id="myThree"></div>

<script>
  // Example 1: Plotly line graph
  function showPlot() {
    document.getElementById("myThree").innerHTML = "";

    Plotly.newPlot("myPlot", [{
      x: [0, 1, 2, 3],
      y: [0, 2, 1, 4],
      mode: "lines+markers",
      type: "scatter"
    }], {
      title: "My Line Graph"
    });
  }

  // Example 2: Plotly bar chart
  function showBar() {
    document.getElementById("myThree").innerHTML = "";

    Plotly.newPlot("myPlot", [{
      x: ["Apples", "Bananas", "Oranges"],
      y: [5, 8, 4],
      type: "bar"
    }], {
      title: "Fruit Amounts"
    });
  }

  // Example 3: Three.js rotating cube
  function showCube() {
    document.getElementById("myPlot").innerHTML = "";

    let scene = new THREE.Scene();
    let camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
    let renderer = new THREE.WebGLRenderer();

    renderer.setSize(300, 300);
    document.getElementById("myThree").innerHTML = "";
    document.getElementById("myThree").appendChild(renderer.domElement);

    let cube = new THREE.Mesh(
      new THREE.BoxGeometry(),
      new THREE.MeshNormalMaterial()
    );

    scene.add(cube);
    camera.position.z = 3;

    function animate() {
      requestAnimationFrame(animate);

      cube.rotation.x += 0.01;
      cube.rotation.y += 0.01;

      renderer.render(scene, camera);
    }

    animate();
  }

  // Show the first example
  showPlot();
</script>
