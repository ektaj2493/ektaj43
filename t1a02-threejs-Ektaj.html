
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>t1a02-threejs-Ektaj.html</title>

  <!-- Load the graphics libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f0f4f8;
      color: #203040;
      margin: 20px;
    }

    h1 {
      color: #1769aa;
    }

    .controls {
      margin: 20px auto;
      max-width: 800px;
    }

    button {
      background: #1769aa;
      color: white;
      border: none;
      padding: 11px 16px;
      margin: 5px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #0d4778;
    }

    #display {
      background: white;
      border-radius: 12px;
      padding: 15px;
      margin: 20px auto;
      max-width: 850px;
      min-height: 250px;
      box-shadow: 0 3px 12px #00000015;
    }

    #plotArea {
      width: 100%;
      height: 400px;
    }

    #threeArea {
      width: 100%;
      height: 400px;
      overflow: hidden;
    }

    #threeArea canvas {
      display: block;
    }

    #description {
      color: #526273;
    }
  </style>
</head>

<body>

  <h1>t1a02-threejs-Ektaj.html</h1>
  <h2>Plotly and Three.js Examples</h2>

  <p>Choose an example to explore interactive graphs and 3D graphics.</p>

  <div class="controls">
    <h3>Plotly Examples</h3>
    <button onclick="showPlot('line')">1. Line Graph</button>
    <button onclick="showPlot('bar')">2. Bar Chart</button>
    <button onclick="showPlot('scatter')">3. Scatter Plot</button>

    <h3>Three.js Examples</h3>
    <button onclick="show3D('cube')">4. Rotating Cube</button>
    <button onclick="show3D('points')">5. Moving Points</button>
    <button onclick="show3D('sphere')">6. 3D Sphere</button>
  </div>

  <div id="display">
    <h3 id="exampleTitle">Welcome!</h3>
    <p id="description">Click a button above to start an example.</p>
    <div id="plotArea"></div>
    <div id="threeArea"></div>
  </div>

  <script>
    // References to the display areas
    const plotArea = document.getElementById("plotArea");
    const threeArea = document.getElementById("threeArea");
    const exampleTitle = document.getElementById("exampleTitle");
    const description = document.getElementById("description");

    // Stop the previous Three.js animation when switching examples
    let animationId = null;
    let renderer = null;

    function clearDisplay() {
      if (animationId !== null) {
        cancelAnimationFrame(animationId);
        animationId = null;
      }

      if (renderer !== null) {
        renderer.dispose();
        renderer.domElement.remove();
        renderer = null;
      }

      plotArea.innerHTML = "";
      threeArea.innerHTML = "";
    }

    // ------------------------------
    // EXAMPLES 1-3: PLOTLY GRAPHS
    // ------------------------------

    function showPlot(type) {
      clearDisplay();

      const x = [0, 1, 2, 3, 4, 5];
      const y = [0, 2, 1, 4, 3, 5];

      let data;
      let title;

      if (type === "line") {
        title = "Line Graph";
        data = [{
          x: x,
          y: y,
          type: "scatter",
          mode: "lines+markers",
          name: "My Data",
          line: { color: "#1769aa", width: 3 },
          marker: { size: 9 }
        }];
      }

      if (type === "bar") {
        title = "Bar Chart";
        data = [{
          x: ["Apples", "Bananas", "Oranges", "Grapes"],
          y: [8, 5, 10, 6],
          type: "bar",
          marker: {
            color: ["red", "gold", "orange", "purple"]
          }
        }];
      }

      if (type === "scatter") {
        title = "Scatter Plot";
        data = [{
          x: [1, 2, 3, 4, 5, 6, 7],
          y: [4, 1, 5, 2, 7, 3, 6],
          type: "scatter",
          mode: "markers",
          marker: {
            size: 13,
            color: "#16a085"
          }
        }];
      }

      exampleTitle.textContent = title;
      description.textContent =
        "This interactive graph was created using Plotly.js.";

      Plotly.newPlot(plotArea, data, {
        title: title,
        xaxis: { title: "X Values" },
        yaxis: { title: "Y Values" },
        margin: { t: 55, b: 55, l: 55, r: 20 },
        paper_bgcolor: "white",
        plot_bgcolor: "#f8fafc"
      }, {
        responsive: true
      });
    }

    // ------------------------------
    // EXAMPLES 4-6: THREE.JS 3D
    // ------------------------------

    function show3D(type) {
      clearDisplay();

      exampleTitle.textContent = {
        cube: "Rotating Cube",
        points: "Moving Points",
        sphere: "3D Sphere"
      }[type];

      description.textContent =
        "Watch the 3D object animate inside the canvas.";

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xf0f4f8);

      const width = Math.max(threeArea.clientWidth, 200);
      const height = 400;

      const camera = new THREE.PerspectiveCamera(
        75, width / height, 0.1, 1000
      );

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(width, height);
      threeArea.appendChild(renderer.domElement);

      camera.position.z = 5;

      let object;

      if (type === "cube") {
        // Example 4: A colorful rotating cube
        const geometry = new THREE.BoxGeometry(2, 2, 2);
        const material = new THREE.MeshNormalMaterial();
        object = new THREE.Mesh(geometry, material);
        scene.add(object);
      }

      if (type === "sphere") {
        // Example 6: A smooth 3D sphere
        const geometry = new THREE.SphereGeometry(1.4, 32, 24);
        const material = new THREE.MeshStandardMaterial({
          color: 0x00aaff,
          roughness: 0.35,
          metalness: 0.2
        });

        object = new THREE.Mesh(geometry, material);

        const light = new THREE.DirectionalLight(0xffffff, 2);
        light.position.set(3, 4, 5);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        scene.add(object);
      }

      if (type === "points") {
        // Example 5: 100 randomly positioned 3D points
        const positions = [];

        for (let i = 0; i < 300; i++) {
          positions.push(
            (Math.random() - 0.5) * 5,
            (Math.random() - 0.5) * 5,
            (Math.random() - 0.5) * 5
          );
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute(
          "position",
          new THREE.Float32BufferAttribute(positions, 3)
        );

        const material = new THREE.PointsMaterial({
          color: 0x00aa55,
          size: 0.08
        });

        object = new THREE.Points(geometry, material);
        scene.add(object);
      }

      // Animation loop
      function animate() {
        animationId = requestAnimationFrame(animate);

        if (type === "points") {
          // Rotate the cloud of points
          object.rotation.y += 0.008;
          object.rotation.x += 0.004;
        } else {
          // Rotate the cube or sphere
          object.rotation.x += 0.01;
          object.rotation.y += 0.015;
        }

        renderer.render(scene, camera);
      }

      animate();
    }

    // Start with the first graph
    showPlot("line");
  </script>

</body>
</html>
