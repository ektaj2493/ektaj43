
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>t2a18-game-template-Ektaj.html</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      background: white;
      font-family: Arial, sans-serif;
    }

    .top-area {
      position: relative;
      height: 130px;
      border-top: 1px solid #ddd;
      overflow: hidden;
    }

    h1 {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      margin: 0;
      white-space: nowrap;
      font-family: "Times New Roman", serif;
      font-size: 30px;
      color: black;
    }

    .image-box {
      position: absolute;
      top: 0;
      width: 100px;
      height: 81px;
      border: 1px solid #c8c8c8;
      background: #fff;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .image-box img,
    #movingImage img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #imageLeft { left: 38px; }
    #imageRight { left: 238px; }

    .buttons {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      padding: 9px 4px;
    }

    button {
      font: 13px Arial, sans-serif;
      padding: 6px 9px;
      color: black;
      cursor: pointer;
    }

    .play-area {
      position: relative;
      height: 360px;
      margin-top: 18px;
      overflow: hidden;
      background: linear-gradient(to bottom, #fff 0%, #fff 72%, #f5f5f5 100%);
    }

    #movingImage {
      position: absolute;
      left: 238px;
      top: 25px;
      width: 100px;
      height: 81px;
      border: 1px solid #c8c8c8;
      background: white;
      overflow: hidden;
      transform: translateX(0);
    }

    .background-moving {
      background-image: repeating-linear-gradient(
        90deg,
        transparent 0px, transparent 59px,
        rgba(0,0,0,.08) 60px, transparent 61px
      );
      background-size: 120px 100%;
      animation: moveBackground 5s linear infinite;
    }

    @keyframes moveBackground {
      from { background-position: 0 0; }
      to { background-position: -1200px 0; }
    }

    @keyframes moveRightFast {
      from { transform: translateX(0); }
      to { transform: translateX(calc(100vw + 150px)); }
    }

    .fast-right {
      animation: moveRightFast 1.2s linear forwards;
    }

    /* Mountain movement */
    @keyframes mountainMove {
      from { transform: translateX(0); }
      to { transform: translateX(150px); }
    }

    .mountain-move {
      animation: mountainMove 2s ease-in-out forwards;
    }

    @media (max-width: 600px) {
      h1 { font-size: 22px; }
      #imageLeft { left: 12px; }
      #imageRight { left: 132px; }
      #movingImage { left: 132px; }
    }
  </style>
</head>

<body>

  <header class="top-area">

    <!-- Real mountain photograph -->
    <div class="image-box" id="imageLeft">
      <img
        src="https://images.prismic.io/goodnature/1ed4db7c-809e-485b-b0df-9704ec001503_snowy-peaks-mountains.jpeg?auto=compress%2Cformat"
        alt="Snowy mountain landscape">
    </div>

    <!-- Real rocket launch photograph -->
    <div class="image-box" id="imageRight">
      <img
        src="https://f7fd61ac87.clvaw-cdnwnd.com/0adf95118fb4fee8ecaafab67a98f61c/200000221-4741547416/T4G-website-001001.jpeg?ph=f7fd61ac87"
        alt="Space shuttle launching">
    </div>

    <h1>t2a18-game-template-Ektaj</h1>
  </header>

  <!-- FIVE BUTTONS -->
  <div class="buttons">

    <button type="button" id="backgroundButton">
      Auto Background Left
    </button>

    <button type="button" id="imageButton">
      Image Right Fast Button
    </button>

    <button type="button" id="resetButton">
      Rocket Reset
    </button>

    <button type="button" id="mountainButton">
      Mountain Move
    </button>

    <!-- NEW MOUNTAIN RESET BUTTON -->
    <button type="button" id="mountainResetButton">
      Mountain Reset
    </button>

  </div>

  <main class="play-area" id="playArea">

    <!-- Moving rocket photograph -->
    <div id="movingImage">
      <img
        src="https://f7fd61ac87.clvaw-cdnwnd.com/0adf95118fb4fee8ecaafab67a98f61c/200000221-4741547416/T4G-website-001001.jpeg?ph=f7fd61ac87"
        alt="Space shuttle launching">
    </div>

  </main>

  <script>

    // Background movement

    const myBackgroundButton = document.getElementById('backgroundButton');
    const myPlayArea = document.getElementById('playArea');

    let myBackgroundIsMoving = false;

    myBackgroundButton.addEventListener('click', function () {
      myBackgroundIsMoving = !myBackgroundIsMoving;

      myPlayArea.classList.toggle(
        'background-moving',
        myBackgroundIsMoving
      );

      myBackgroundButton.textContent = myBackgroundIsMoving
        ? 'Stop Background'
        : 'Auto Background Left';
    });


    // Rocket movement

    const myImageButton = document.getElementById('imageButton');
    const myMovingImage = document.getElementById('movingImage');
    const myResetButton = document.getElementById('resetButton');

    myImageButton.addEventListener('click', function () {
      myMovingImage.classList.remove('fast-right');
      void myMovingImage.offsetWidth;
      myMovingImage.classList.add('fast-right');
    });


    // Rocket Reset

    myResetButton.addEventListener('click', function () {
      myMovingImage.classList.remove('fast-right');

      myMovingImage.style.animation = 'none';
      myMovingImage.style.transform = 'translateX(0)';

      void myMovingImage.offsetWidth;
      myMovingImage.style.animation = '';
    });


    // Mountain movement

    const myMountainButton = document.getElementById('mountainButton');
    const myMountainImage = document.getElementById('imageLeft');

    myMountainButton.addEventListener('click', function () {
      myMountainImage.classList.remove('mountain-move');

      void myMountainImage.offsetWidth;

      myMountainImage.classList.add('mountain-move');
    });


    // Mountain Reset

    const myMountainResetButton = document.getElementById('mountainResetButton');

    myMountainResetButton.addEventListener('click', function () {
      myMountainImage.classList.remove('mountain-move');

      // Return the mountain to its original position
      myMountainImage.style.animation = 'none';
      myMountainImage.style.transform = 'translateX(0)';

      // Prepare for the next mountain movement
      void myMountainImage.offsetWidth;
      myMountainImage.style.animation = '';
    });

  </script>

</body>
</html>
