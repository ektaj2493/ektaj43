
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>t2a18-game-template-Ektaj.html</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      background: white;
      font-family: Arial, sans-serif;
    }

    .top-area {
      position: relative;
      height: 130px;
      border-top: 1px solid #ddd;
      overflow: hidden;
    }

    h1 {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      margin: 0;
      white-space: nowrap;
      font-family: "Times New Roman", serif;
      font-size: 30px;
      color: black;
    }

    .image-box {
      position: absolute;
      top: 0;
      width: 100px;
      height: 81px;
      border: 1px solid #c8c8c8;
      background: #fff;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .image-box svg,
    #movingImage svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    #imageLeft { left: 38px; }
    #imageRight { left: 238px; }

    .buttons {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      padding: 9px 4px;
    }

    button {
      font: 13px Arial, sans-serif;
      padding: 6px 9px;
      color: black;
      cursor: pointer;
    }

    .play-area {
      position: relative;
      height: 360px;
      margin-top: 18px;
      overflow: hidden;
      background: linear-gradient(to bottom, #fff 0%, #fff 72%, #f5f5f5 100%);
    }

    #movingImage {
      position: absolute;
      left: 238px;
      top: 25px;
      width: 100px;
      height: 81px;
      border: 1px solid #c8c8c8;
      background: white;
      overflow: hidden;
    }

    .background-moving {
      background-image: repeating-linear-gradient(
        90deg,
        transparent 0px, transparent 59px,
        rgba(0,0,0,.08) 60px, transparent 61px
      );
      background-size: 120px 100%;
      animation: moveBackground 5s linear infinite;
    }

    @keyframes moveBackground {
      from { background-position: 0 0; }
      to { background-position: -1200px 0; }
    }

    @keyframes moveRightFast {
      from { transform: translateX(0); }
      to { transform: translateX(calc(100vw + 150px)); }
    }

    .fast-right {
      animation: moveRightFast 1.2s linear forwards;
    }

    @media (max-width: 600px) {
      h1 { font-size: 22px; }
      #imageLeft { left: 12px; }
      #imageRight { left: 132px; }
      #movingImage { left: 132px; }
    }
  </style>
</head>

<body>

  <header class="top-area">

    <!-- Image 1: Mountain landscape -->
    <div class="image-box" id="imageLeft" aria-label="Mountain landscape">
      <svg viewBox="0 0 100 81" xmlns="http://www.w3.org/2000/svg">
        <rect width="100" height="81" fill="#87CEEB"/>
        <circle cx="76" cy="17" r="10" fill="#FFD93D"/>
        <path d="M0 65 L30 20 L65 65 Z" fill="#64748b"/>
        <path d="M30 20 L43 40 L35 35 L30 43 L23 34 Z" fill="white"/>
        <path d="M35 65 L68 25 L105 65 Z" fill="#475569"/>
        <path d="M68 25 L80 40 L70 35 L65 43 L59 35 Z" fill="white"/>
        <rect y="65" width="100" height="16" fill="#4CAF50"/>
        <path d="M0 73 Q25 60 50 72 T100 70 V81 H0 Z" fill="#2E8B57"/>
      </svg>
    </div>

    <!-- Image 2: Rocket -->
    <div class="image-box" id="imageRight" aria-label="Cartoon rocket">
      <svg viewBox="0 0 100 81" xmlns="http://www.w3.org/2000/svg">
        <rect width="100" height="81" fill="#172554"/>
        <circle cx="15" cy="14" r="2" fill="white"/>
        <circle cx="80" cy="12" r="2" fill="white"/>
        <circle cx="87" cy="55" r="2" fill="white"/>
        <circle cx="20" cy="55" r="2" fill="white"/>
        <g transform="translate(50 40) rotate(35)">
          <path d="M0 -28 Q18 -10 14 12 L-14 12 Q-18 -10 0 -28" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
          <circle cy="-7" r="7" fill="#38bdf8" stroke="#2563eb" stroke-width="2"/>
          <path d="M-14 5 L-26 20 L-13 17 Z" fill="#ef4444"/>
          <path d="M14 5 L26 20 L13 17 Z" fill="#ef4444"/>
          <path d="M-8 12 L0 31 L8 12 Z" fill="#f97316"/>
          <path d="M-4 15 L0 26 L4 15 Z" fill="#fde047"/>
        </g>
      </svg>
    </div>

    <h1>t2a18-game-template-Ektaj</h1>
  </header>

  <!-- THREE BUTTONS -->
  <div class="buttons">
    <button type="button" id="backgroundButton">
      Auto Background Left
    </button>

    <button type="button" id="imageButton">
      Image Right Fast Button
    </button>

    <button type="button" id="resetButton">
      Rocket Reset
    </button>
  </div>

  <main class="play-area" id="playArea">

    <!-- Moving rocket -->
    <div id="movingImage" aria-label="Moving rocket">
      <svg viewBox="0 0 100 81" xmlns="http://www.w3.org/2000/svg">
        <rect width="100" height="81" fill="#172554"/>
        <circle cx="15" cy="14" r="2" fill="white"/>
        <circle cx="80" cy="12" r="2" fill="white"/>
        <circle cx="87" cy="55" r="2" fill="white"/>
        <circle cx="20" cy="55" r="2" fill="white"/>
        <g transform="translate(50 40) rotate(35)">
          <path d="M0 -28 Q18 -10 14 12 L-14 12 Q-18 -10 0 -28" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
          <circle cy="-7" r="7" fill="#38bdf8" stroke="#2563eb" stroke-width="2"/>
          <path d="M-14 5 L-26 20 L-13 17 Z" fill="#ef4444"/>
          <path d="M14 5 L26 20 L13 17 Z" fill="#ef4444"/>
          <path d="M-8 12 L0 31 L8 12 Z" fill="#f97316"/>
          <path d="M-4 15 L0 26 L4 15 Z" fill="#fde047"/>
        </g>
      </svg>
    </div>

  </main>

  <script>
    // Auto Background Left starts and stops the scrolling background.

    const myBackgroundButton = document.getElementById('backgroundButton');
    const myPlayArea = document.getElementById('playArea');

    let myBackgroundIsMoving = false;

    myBackgroundButton.addEventListener('click', function () {
      myBackgroundIsMoving = !myBackgroundIsMoving;

      myPlayArea.classList.toggle(
        'background-moving',
        myBackgroundIsMoving
      );

      myBackgroundButton.textContent = myBackgroundIsMoving
        ? 'Stop Background'
        : 'Auto Background Left';
    });

    // Image Right Fast Button sends the rocket quickly to the right.

    const myImageButton = document.getElementById('imageButton');
    const myMovingImage = document.getElementById('movingImage');

    myImageButton.addEventListener('click', function () {
      myMovingImage.classList.remove('fast-right');

      // Restart the animation when clicked again.
      void myMovingImage.offsetWidth;

      myMovingImage.classList.add('fast-right');
    });

    myMovingImage.addEventListener('animationend', function () {
      myMovingImage.classList.remove('fast-right');
    });

    // Rocket Reset sends the rocket back to its starting position.

    const myResetButton = document.getElementById('resetButton');

    myResetButton.addEventListener('click', function () {
      myMovingImage.classList.remove('fast-right');
      myMovingImage.style.transform = 'translateX(0)';
    });

  </script>

</body>
</html>
