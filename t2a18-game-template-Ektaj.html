
<!DOCTYPE html>
<html>
<head>
  <title>t2a18-game-template-Ektaj</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: lightblue;
    }

    h1 {
      color: darkblue;
    }

    .image-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 20px;
      flex-wrap: wrap;
    }

    .picture {
      width: 250px;
      height: 150px;
      border: 3px solid black;
      border-radius: 10px;
      overflow: hidden;
    }

    .picture img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #myMovingImage {
      width: 100px;
      position: relative;
      left: 0;
    }

    .game-area {
      width: 90%;
      height: 180px;
      margin: 30px auto;
      background-color: white;
      border: 3px solid black;
      overflow: hidden;
      text-align: left;
    }

    .fast-right {
      animation: moveRightFast 1.2s linear forwards;
    }

    .mountain-move {
      animation: mountainMove 2s ease-in-out forwards;
    }

    @keyframes moveRightFast {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(700px);
      }
    }

    @keyframes mountainMove {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(150px);
      }
    }

    button {
      padding: 12px 18px;
      margin: 8px;
      border: none;
      border-radius: 8px;
      background-color: darkblue;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: royalblue;
    }
  </style>
</head>

<body>

  <h1>t2a18-game-template-Ektaj</h1>

  <h2>My Images</h2>

  <div class="image-container">

    <!-- Mountain image -->
    <div class="picture">
      <img id="myMountainImage"
        src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 200'%3E%3Crect width='400' height='200' fill='%2387ceeb'/%3E%3Ccircle cx='320' cy='40' r='25' fill='yellow'/%3E%3Cpath d='M0 180 L120 35 L240 180 Z' fill='%23556b2f'/%3E%3Cpath d='M120 35 L85 80 L120 68 L150 85 Z' fill='white'/%3E%3Cpath d='M160 180 L280 55 L400 180 Z' fill='%236b8e23'/%3E%3Cpath d='M280 55 L250 90 L280 78 L310 90 Z' fill='white'/%3E%3Crect y='180' width='400' height='20' fill='%233cb371'/%3E%3C/svg%3E"
        alt="Mountain landscape">
    </div>

    <!-- Rocket image -->
    <div class="picture">
      <img
        src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Cpath d='M100 10 C55 55 65 125 100 155 C135 125 145 55 100 10Z' fill='%23e53935' stroke='%23333' stroke-width='4'/%3E%3Ccircle cx='100' cy='80' r='18' fill='%2387ceeb' stroke='%23333' stroke-width='4'/%3E%3Cpath d='M70 115 L35 155 L75 145 Z' fill='%23ff9800'/%3E%3Cpath d='M130 115 L165 155 L125 145 Z' fill='%23ff9800'/%3E%3Cpath d='M85 150 L100 195 L115 150 Z' fill='%23ff9800'/%3E%3C/svg%3E"
        alt="Rocket">
    </div>

  </div>

  <h2>My Moving Rocket</h2>

  <div class="game-area">
    <img
      id="myMovingImage"
      src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Cpath d='M100 10 C55 55 65 125 100 155 C135 125 145 55 100 10Z' fill='%23e53935' stroke='%23333' stroke-width='4'/%3E%3Ccircle cx='100' cy='80' r='18' fill='%2387ceeb' stroke='%23333' stroke-width='4'/%3E%3Cpath d='M70 115 L35 155 L75 145 Z' fill='%23ff9800'/%3E%3Cpath d='M130 115 L165 155 L125 145 Z' fill='%23ff9800'/%3E%3Cpath d='M85 150 L100 195 L115 150 Z' fill='%23ff9800'/%3E%3C/svg%3E"
      alt="Moving rocket">
  </div>

  <h2>Controls</h2>

  <button id="myBackgroundButton">
    Auto Background Left
  </button>

  <button id="myImageButton">
    Move Rocket Fast
  </button>

  <button id="myResetButton">
    Reset Rocket
  </button>

  <button id="myMountainButton">
    Move Mountain
  </button>

  <script>
    // Get the buttons and images
    let myBackgroundButton = document.getElementById('myBackgroundButton');
    let myImageButton = document.getElementById('myImageButton');
    let myResetButton = document.getElementById('myResetButton');
    let myMountainButton = document.getElementById('myMountainButton');

    let myMovingImage = document.getElementById('myMovingImage');
    let myMountainImage = document.getElementById('myMountainImage');

    // Move the background left
    myBackgroundButton.addEventListener('click', function() {
      document.body.style.backgroundPosition = 'left';
      document.body.style.backgroundImage =
        'linear-gradient(to right, lightblue, skyblue)';
      document.body.style.backgroundSize = '200% 100%';
      document.body.style.backgroundRepeat = 'no-repeat';
      document.body.style.animation = 'backgroundMove 5s linear infinite';
    });

    // Move the rocket fast to the right
    myImageButton.addEventListener('click', function() {
      myMovingImage.classList.remove('fast-right');
      void myMovingImage.offsetWidth;
      myMovingImage.classList.add('fast-right');
    });

    // Reset the rocket
    myResetButton.addEventListener('click', function() {
      myMovingImage.classList.remove('fast-right');
      myMovingImage.style.animation = 'none';
      myMovingImage.style.transform = 'translateX(0)';
      void myMovingImage.offsetWidth;
      myMovingImage.style.animation = '';
    });

    // Move the mountain to the right
    myMountainButton.addEventListener('click', function() {
      myMountainImage.classList.remove('mountain-move');
      void myMountainImage.offsetWidth;
      myMountainImage.classList.add('mountain-move');
    });
  </script>

</body>
</html>
