
<!DOCTYPE html>
<html>
<head>
    <title>Decisions by Ektaj</title>
</head>

<body style="background-color: 

<h1 align="center">JavaScript Decisions by Ektaj</h1>

<h3>Enter Your Numbers</h3>

<input id="myNum01" type="number" value="4">
<input id="myNum02" type="number" value="7">

<h3>1. Simple if</h3>
<button onclick="
let n = Number(document.getElementById('myNum01').value);
if (n >= 3) {
    document.getElementById('result01').innerHTML = n + ' is at least 3';
}
">Run If</button>
<div id="result01">...</div>

<h3>2. If Else</h3>
<button onclick="
let n = Number(document.getElementById('myNum01').value);
if (n >= 3) {
    document.getElementById('result02').innerHTML = n + ' is at least 3';
} else {
    document.getElementById('result02').innerHTML = n + ' is less than 3';
}
">Run If Else</button>
<div id="result02">...</div>

<h3>3. Complex If</h3>
<button onclick="
let n = Number(document.getElementById('myNum01').value);
if (n > -3 && n <= 100 && n != 3) {
    document.getElementById('result03').innerHTML = n + ' meets the condition';
} else {
    document.getElementById('result03').innerHTML = n + ' does not meet the condition';
}
">Run Complex If</button>
<div id="result03">...</div>

<h3>4. Positive, Negative, or Zero</h3>
<button onclick="
let n = Number(document.getElementById('myNum01').value);
if (n > 0) {
    document.getElementById('result04').innerHTML = 'Positive';
} else if (n < 0) {
    document.getElementById('result04').innerHTML = 'Negative';
} else {
    document.getElementById('result04').innerHTML = 'Zero';
}
">Check Number</button>
<div id="result04">...</div>

<h3>5. Even or Odd</h3>
<button onclick="
let n = Number(document.getElementById('myNum01').value);
if (n % 2 == 0) {
    document.getElementById('result05').innerHTML = 'Even';
} else {
    document.getElementById('result05').innerHTML = 'Odd';
}
">Check Even or Odd</button>
<div id="result05">...</div>

<h3>6. Compare Two Numbers</h3>
<button onclick="
let a = Number(document.getElementById('myNum01').value);
let b = Number(document.getElementById('myNum02').value);
if (a > b) {
    document.getElementById('result06').innerHTML = a + ' is bigger';
} else if (a < b) {
    document.getElementById('result06').innerHTML = b + ' is bigger';
} else {
    document.getElementById('result06').innerHTML = 'They are equal';
}
">Compare</button>
<div id="result06">...</div>

<h3>7. Nested If</h3>
<button onclick="
let n = Number(document.getElementById('myNum01').value);
if (n > 0) {
    if (n >= 10) {
        document.getElementById('result07').innerHTML = 'Positive and at least 10';
    } else {
        document.getElementById('result07').innerHTML = 'Positive but less than 10';
    }
} else {
    document.getElementById('result07').innerHTML = 'Not positive';
}
">Run Nested If</button>
<div id="result07">...</div>

<h3>8. Grade Calculator</h3>
<button onclick="
let n = Number(document.getElementById('myNum01').value);
if (n < 0 || n > 100) {
    document.getElementById('result08').innerHTML = 'Enter 0 to 100';
} else if (n >= 90) {
    document.getElementById('result08').innerHTML = 'Grade A';
} else if (n >= 80) {
    document.getElementById('result08').innerHTML = 'Grade B';
} else if (n >= 70) {
    document.getElementById('result08').innerHTML = 'Grade C';
} else if (n >= 60) {
    document.getElementById('result08').innerHTML = 'Grade D';
} else {
    document.getElementById('result08').innerHTML = 'Grade F';
}
">Check Grade</button>
<div id="result08">...</div>

<h3>9. Divisible by 5 and 10</h3>
<button onclick="
let n = Number(document.getElementById('myNum01').value);
if (n % 5 == 0 && n % 10 == 0) {
    document.getElementById('result09').innerHTML = 'Divisible by both';
} else {
    document.getElementById('result09').innerHTML = 'Not divisible by both';
}
">Check Divisibility</button>
<div id="result09">...</div>

<h3>10. Number Range</h3>
<button onclick="
let n = Number(document.getElementById('myNum01').value);
if (n >= 1 && n <= 20) {
    document.getElementById('result10').innerHTML = 'Between 1 and 20';
} else {
    document.getElementById('result10').innerHTML = 'Outside the range';
}
">Check Range</button>
<div id="result10">...</div>

</body>
</html>
