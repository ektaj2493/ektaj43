
<!DOCTYPE html>
<html>
<head>
  <title>t2a20-sort-Ektaj.html</title>
</head>

<body>

<h1>t2a20-sort-Ektaj.html</h1>

<h2>1. Manual Alphabet Sort</h2>

<button onclick="myRandom()">Set Random</button>
<button onclick="myShow()">Show</button>
<button onclick="mySort()">Sort A-Z</button>
<button onclick="myReverse()">Sort Z-A</button>
<button onclick="myReset()">Reset</button>

<div id="myDiv"></div>
<p id="myStatus"></p>


<h2>2. Seeded Alphabet Sort</h2>

Seed: <input id="mySeed" value="123">

<button onclick="mySeedRandom()">Generate</button>
<button onclick="mySeedSort()">Sort A-Z</button>
<button onclick="mySeedReverse()">Sort Z-A</button>

<div id="myDiv2"></div>
<p id="mySeedStatus"></p>


<h2>3. Number Sort</h2>

Amount: <input id="myAmount" type="number" value="10" min="1" max="100">

<button onclick="myNumberRandom()">Random Numbers</button>
<button onclick="myNumberSort()">Smallest First</button>
<button onclick="myNumberReverse()">Largest First</button>
<button onclick="myNumberReset()">Reset</button>

<div id="myDiv3"></div>
<p id="myNumberStatus"></p>


<h2>4. Word Sort</h2>

<input id="myNewWord" placeholder="Enter a word">
<button onclick="myAddWord()">Add Word</button>

<br><br>

<button onclick="myWordRandom()">Shuffle Words</button>
<button onclick="myWordSort()">Sort A-Z</button>
<button onclick="myWordReverse()">Sort Z-A</button>
<button onclick="myWordReset()">Reset</button>

<div id="myDiv4"></div>
<p id="myWordStatus"></p>


<script>

// 1. MANUAL ALPHABET SORT

let myLetters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
let myOriginalLetters = myLetters.slice();

function myShow() {
  document.getElementById("myDiv").innerHTML = myLetters.join(" ");
}

function myRandom() {
  for (let myI = myLetters.length - 1; myI > 0; myI--) {
    let myJ = Math.floor(Math.random() * (myI + 1));
    let myTemp = myLetters[myI];
    myLetters[myI] = myLetters[myJ];
    myLetters[myJ] = myTemp;
  }

  myShow();
  document.getElementById("myStatus").innerHTML = "Letters shuffled!";
}

function mySort() {
  let myCount = 0;

  for (let myI = 0; myI < myLetters.length; myI++) {
    for (let myJ = 0; myJ < myLetters.length - 1; myJ++) {
      myCount++;

      if (myLetters[myJ] > myLetters[myJ + 1]) {
        let myTemp = myLetters[myJ];
        myLetters[myJ] = myLetters[myJ + 1];
        myLetters[myJ + 1] = myTemp;
      }
    }
  }

  myShow();
  document.getElementById("myStatus").innerHTML =
    "Sorted A-Z! Comparisons: " + myCount;
}

function myReverse() {
  mySort();
  myLetters.reverse();
  myShow();
  document.getElementById("myStatus").innerHTML = "Sorted Z-A!";
}

function myReset() {
  myLetters = myOriginalLetters.slice();
  myShow();
  document.getElementById("myStatus").innerHTML = "Alphabet reset!";
}


// 2. SEEDED ALPHABET SORT

let myLetters2 = [];

function mySeedRandom() {
  let mySeed = Number(document.getElementById("mySeed").value);

  if (!Number.isSafeInteger(mySeed) ||
      document.getElementById("mySeed").value.trim() == "") {
    alert("Enter a whole number for the seed!");
    return;
  }

  mySeed = ((mySeed % 233280) + 233280) % 233280;

  myLetters2 = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

  for (let myI = myLetters2.length - 1; myI > 0; myI--) {
    mySeed = (mySeed * 9301 + 49297) % 233280;

    let myJ = Math.floor((mySeed / 233280) * (myI + 1));

    let myTemp = myLetters2[myI];
    myLetters2[myI] = myLetters2[myJ];
    myLetters2[myJ] = myTemp;
  }

  mySeedShow();

  document.getElementById("mySeedStatus").innerHTML =
    "Generated using seed: " + document.getElementById("mySeed").value;
}

function mySeedShow() {
  document.getElementById("myDiv2").innerHTML = myLetters2.join(" ");
}

function mySeedSort() {
  if (myLetters2.length == 0) {
    alert("Generate letters first!");
    return;
  }

  let myCount = 0;

  for (let myI = 0; myI < myLetters2.length; myI++) {
    for (let myJ = 0; myJ < myLetters2.length - 1; myJ++) {
      myCount++;

      if (myLetters2[myJ] > myLetters2[myJ + 1]) {
        let myTemp = myLetters2[myJ];
        myLetters2[myJ] = myLetters2[myJ + 1];
        myLetters2[myJ + 1] = myTemp;
      }
    }
  }

  mySeedShow();

  document.getElementById("mySeedStatus").innerHTML =
    "Sorted A-Z! Comparisons: " + myCount;
}

function mySeedReverse() {
  if (myLetters2.length == 0) {
    alert("Generate letters first!");
    return;
  }

  mySeedSort();
  myLetters2.reverse();
  mySeedShow();

  document.getElementById("mySeedStatus").innerHTML = "Sorted Z-A!";
}


// 3. NUMBER SORT

let myNumbers = [8, 3, 10, 1, 6, 4, 9, 2, 7, 5];
let myOriginalNumbers = myNumbers.slice();

function myNumberShow() {
  document.getElementById("myDiv3").innerHTML = myNumbers.join(", ");
}

function myNumberRandom() {
  let myAmount = Number(document.getElementById("myAmount").value);

  if (!Number.isInteger(myAmount) || myAmount < 1 || myAmount > 100) {
    alert("Choose an amount from 1 to 100!");
    return;
  }

  myNumbers = [];

  for (let myI = 0; myI < myAmount; myI++) {
    myNumbers.push(Math.floor(Math.random() * 100) + 1);
  }

  myNumberShow();
  document.getElementById("myNumberStatus").innerHTML = "New random numbers!";
}

function myNumberSort() {
  let myCount = 0;

  for (let myI = 0; myI < myNumbers.length; myI++) {
    for (let myJ = 0; myJ < myNumbers.length - 1; myJ++) {
      myCount++;

      if (myNumbers[myJ] > myNumbers[myJ + 1]) {
        let myTemp = myNumbers[myJ];
        myNumbers[myJ] = myNumbers[myJ + 1];
        myNumbers[myJ + 1] = myTemp;
      }
    }
  }

  myNumberShow();

  document.getElementById("myNumberStatus").innerHTML =
    "Smallest first! Comparisons: " + myCount;
}

function myNumberReverse() {
  myNumberSort();
  myNumbers.reverse();
  myNumberShow();

  document.getElementById("myNumberStatus").innerHTML =
    "Largest first!";
}

function myNumberReset() {
  myNumbers = myOriginalNumbers.slice();
  myNumberShow();

  document.getElementById("myNumberStatus").innerHTML =
    "Numbers reset!";
}


// 4. WORD SORT

let myWords = ["Banana", "Apple", "Orange", "Grape", "Mango", "Cherry"];
let myOriginalWords = myWords.slice();

function myWordShow() {
  document.getElementById("myDiv4").innerHTML = myWords.join(", ");
}

function myAddWord() {
  let myWord = document.getElementById("myNewWord").value.trim();

  if (myWord == "") {
    alert("Enter a word first!");
    return;
  }

  myWords.push(myWord);

  document.getElementById("myNewWord").value = "";

  myWordShow();

  document.getElementById("myWordStatus").innerHTML =
    "Word added!";
}

function myWordRandom() {
  for (let myI = myWords.length - 1; myI > 0; myI--) {
    let myJ = Math.floor(Math.random() * (myI + 1));

    let myTemp = myWords[myI];
    myWords[myI] = myWords[myJ];
    myWords[myJ] = myTemp;
  }

  myWordShow();

  document.getElementById("myWordStatus").innerHTML =
    "Words shuffled!";
}

function myWordSort() {
  let myCount = 0;

  for (let myI = 0; myI < myWords.length; myI++) {
    for (let myJ = 0; myJ < myWords.length - 1; myJ++) {
      myCount++;

      if (myWords[myJ].toLowerCase() >
          myWords[myJ + 1].toLowerCase()) {

        let myTemp = myWords[myJ];
        myWords[myJ] = myWords[myJ + 1];
        myWords[myJ + 1] = myTemp;
      }
    }
  }

  myWordShow();

  document.getElementById("myWordStatus").innerHTML =
    "Words sorted A-Z! Comparisons: " + myCount;
}

function myWordReverse() {
  myWordSort();
  myWords.reverse();
  myWordShow();

  document.getElementById("myWordStatus").innerHTML =
    "Words sorted Z-A!";
}

function myWordReset() {
  myWords = myOriginalWords.slice();
  myWordShow();

  document.getElementById("myWordStatus").innerHTML =
    "Words reset!";
}


// SHOW EXAMPLES WHEN PAGE OPENS

myShow();
myNumberShow();
myWordShow();

</script>

</body>
</html>
